<script>
// ==========================================
// 1. 純 Web Audio API 歡樂音效與輕快 BGM
// ==========================================
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let bgmInterval = null;
let bgmEnabled = true;
let sfxEnabled = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
}

function playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.15) {
  if (!sfxEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// 答對三連音
function playCorrectSfx() {
  playTone(523.25, 'triangle', 0.12, 0.2);
  setTimeout(() => playTone(659.25, 'triangle', 0.12, 0.2), 100);
  setTimeout(() => playTone(783.99, 'triangle', 0.15, 0.2), 200);
  setTimeout(() => playTone(1046.50, 'triangle', 0.3, 0.25), 300);
}

// 答錯溫和提示音
function playWrongSfx() {
  playTone(330, 'sine', 0.18, 0.2);
  setTimeout(() => playTone(247, 'sine', 0.25, 0.2), 160);
}

// 扭蛋喀喀轉動聲
function playGachaCrankSfx() {
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      playTone(400 + Math.random() * 200, 'square', 0.05, 0.1);
    }, i * 80);
  }
}

// 扭蛋打開碰開驚喜音
function playGachaOpenSfx() {
  playTone(587.33, 'triangle', 0.1, 0.2);
  setTimeout(() => playTone(880, 'triangle', 0.1, 0.2), 80);
  setTimeout(() => playTone(1174.66, 'sine', 0.35, 0.3), 160);
}

// 輕快五聲音階背景音樂生成
const bgmNotes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
let bgmStep = 0;
function startBgm() {
  if (bgmInterval) clearInterval(bgmInterval);
  bgmInterval = setInterval(() => {
    if (!bgmEnabled) return;
    try {
      initAudio();
      // 主旋律
      const note = bgmNotes[bgmStep % bgmNotes.length];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(note, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);

      // 低音跳躍伴奏
      if (bgmStep % 2 === 0) {
        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'triangle';
        bassOsc.frequency.setValueAtTime(130.81, audioCtx.currentTime);
        bassGain.gain.setValueAtTime(0.03, audioCtx.currentTime);
        bassGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        bassOsc.connect(bassGain);
        bassGain.connect(audioCtx.destination);
        bassOsc.start();
        bassOsc.stop(audioCtx.currentTime + 0.38);
      }
      bgmStep++;
    } catch(e) {}
  }, 360);
}

function toggleBgm() {
  bgmEnabled = !bgmEnabled;
  document.getElementById('bgmBtn').innerText = bgmEnabled ? '🎵' : '🔇';
  if (bgmEnabled && !bgmInterval) startBgm();
}

function toggleSfx() {
  sfxEnabled = !sfxEnabled;
  document.getElementById('sfxBtn').innerText = sfxEnabled ? '🔊' : '🔈';
}

// ==========================================
// 2. 整合三個單元之核心題庫 (共 14 道題)

        <text x="325" y="75" font-size="32" font-weight="bold" fill="#38bdf8" text-anchor="middle">＝ ？</text>
      </svg>
    `
  },
  {

    score: 10,

    renderSvg: () => `
      <svg viewBox="0 0 400 120" class="w-full max-w-md h-auto">
        <rect x="40" y="20" width="150" height="80" rx="16" fill="#312e81" stroke="#818cf8" stroke-width="3"/>

        <text x="315" y="68" font-size="30" font-weight="bold" fill="#38bdf8" text-anchor="middle">？</text>

  },
  {
    topic: "NC-1-1-1 又來幾個接著數",
    q: "花園裡原來有 7 隻小雞，又跑來 4 隻，現在一共有幾隻小雞？",
    type: "chick_count",
    options: ["10 隻", "11 隻", "12 隻", "13 隻"],
    answerIndex: 1,
    score: 10,
    hint: "記住原本的 7 隻，接著往後數 4 隻：8、9、10、11！所以一共有 11 隻小雞！",
    renderSvg: () => `
      <svg viewBox="0 0 420 120" class="w-full max-w-md h-auto">
        <rect x="15" y="25" width="130" height="75" rx="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>

        <circle cx="250" cy="50" r="10" fill="#60a5fa"/><text x="250" y="54" font-size="11" fill="#fff" text-anchor="middle">11</text>
        <circle cx="310" cy="50" r="16" fill="#f59e0b"/><text x="310" y="56" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">12</text>
        <text x="310" y="85" font-size="12" fill="#fde047" text-anchor="middle">後唸(較大)</text>
      </svg>
    `
  },
  {
    topic: "NC-1-1-1 點數與十的累加",
    q: "請按照順序讀出數字：30 → 31 → 32 → (  ) → 34 → 35。括號裡應該填入多少？",
    type: "fill_sequence",
    options: ["23", "33", "43", "36"],
    answerIndex: 1,
    score: 10,
    hint: "30多1個是31、31多1個是32，那麼32再多1個就是 33 囉！",
    renderSvg: () => `
      <svg viewBox="0 0 380 100" class="w-full max-w-md h-auto">
        <text x="35" y="58" font-size="20" font-weight="bold" fill="#94a3b8">30→</text>
        <text x="90" y="58" font-size="20" font-weight="bold" fill="#94a3b8">31→</text>
        <text x="145" y="58" font-size="20" font-weight="bold" fill="#94a3b8">32→</text>
        <rect x="195" y="25" width="55" height="45" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
        <text x="222" y="56" font-size="24" font-weight="bold" fill="#38bdf8" text-anchor="middle">？</text>
        <text x="265" y="58" font-size="20" font-weight="bold" fill="#94a3b8">→34→35</text>
      </svg>
    `
  }
];

// ==========================================
// 3. 遊戲進行邏輯與扭蛋盲盒機制
// ==========================================
let currentQuestions = [...questionBank];
let currentQIndex = 0;
let totalClassScore = 0;
let currentQFailed = false; // 是否曾答錯標記

// 太空扭蛋盲盒獎品庫
const gachaPrizes = [
  { icon: "🌟", title: "+10 顆能量星星", desc: "太空訊號滿格！全班加 10 分！", addScore: 10, bg: "from-amber-400 to-yellow-500" },
  { icon: "💎", title: "+20 顆超能水晶", desc: "大豐收！挖到稀有宇宙能量水晶！", addScore: 20, bg: "from-cyan-400 to-blue-500" },
  { icon: "🚀", title: "+15 火箭推進動能", desc: "點火全速衝刺！全班前進大加分！", addScore: 15, bg: "from-rose-500 to-orange-400" },
  { icon: "🍀", title: "幸運能量大翻倍 (x1.5)", desc: "幸運小精靈附體！本題星數額外加 15 分！", addScore: 15, bg: "from-emerald-400 to-green-600" },
  { icon: "🛡️", title: "+10 宇宙守護護盾", desc: "保護全體探險家，全班歡呼加 10 分！", addScore: 10, bg: "from-purple-500 to-indigo-500" }
];
let currentDrawnPrize = null;
let isGachaSpinning = false;
let isBallOpened = false;

function loadQuestion(index) {
  currentQFailed = false;
  document.getElementById('mistakeBadge').classList.add('hidden');
  
  const qData = currentQuestions[index];
  document.getElementById('questProgress').innerText = `${index + 1} / ${currentQuestions.length}`;
  document.getElementById('topicBadge').innerText = qData.topic;
  document.getElementById('questionText').innerText = qData.q;
  
  // 渲染 SVG 圖形
  document.getElementById('illustrationArea').innerHTML = qData.renderSvg();

  // 渲染 4 個選項按鈕
  const optionsGrid = document.getElementById('optionsGrid');
  optionsGrid.innerHTML = '';
  qData.options.forEach((optText, optIdx) => {
    const btn = document.createElement('button');
    btn.className = `p-4 md:p-5 rounded-2xl bg-indigo-700/80 hover:bg-indigo-600 border-2 border-indigo-400/50 text-white font-black text-lg md:text-xl btn-3d text-left flex items-center gap-3`;
    btn.innerHTML = `
      <span class="w-8 h-8 rounded-full bg-white/20 text-yellow-300 flex items-center justify-center font-bold text-sm shrink-0">
        ${['A','B','C','D'][optIdx]}
      </span>
      <span>${optText}</span>
    `;
    btn.onclick = () => handleAnswerSelect(optIdx);
    optionsGrid.appendChild(btn);
  });
}

// 點選答案
function handleAnswerSelect(selectedIdx) {
  const qData = currentQuestions[currentQIndex];
  const isCorrect = (selectedIdx === qData.answerIndex);

  const modal = document.getElementById('explanationModal');
  const icon = document.getElementById('modalStatusIcon');
  const title = document.getElementById('modalTitle');
  const detail = document.getElementById('explanationDetail');
  const actions = document.getElementById('modalActions');

  detail.innerText = qData.hint;

  if (isCorrect) {
    playCorrectSfx();
    icon.innerText = "🎉";
    title.innerText = "太棒了！答對囉！";
    title.className = "text-2xl md:text-3xl font-black text-yellow-300 mb-2";

    // 加分邏輯：若沒答錯過，加題目的基礎分數
    let earnedScore = 0;
    if (!currentQFailed) {
      earnedScore = qData.score;
      totalClassScore += earnedScore;
      updateScoreDisplay();
    }

    // 答對按鈕
    actions.innerHTML = `
      <button onclick="openGachaStage(${!currentQFailed})" class="px-6 py-3.5 bg-gradient-to-r from-amber-400 to-yellow-500 hover:from-amber-300 text-slate-900 font-black text-xl rounded-2xl btn-3d flex items-center gap-2">
        <span>🛸 前往太空扭蛋機加分！</span>
      </button>
    `;

  } else {
    // 答錯
    playWrongSfx();
    currentQFailed = true;
    document.getElementById('mistakeBadge').classList.remove('hidden');

    icon.innerText = "💡";
    title.innerText = "差一點點！來看看老師怎麼說：";
    title.className = "text-2xl md:text-3xl font-black text-rose-300 mb-2";

    // 答錯引導按鈕：看懂後再試一次
    actions.innerHTML = `
      <button onclick="closeExplanationModalAndRetry()" class="px-6 py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 text-white font-black text-xl rounded-2xl btn-3d">
        我弄懂了，換我再選一次！💪
      </button>
    `;
  }

  modal.classList.remove('hidden');
}

function closeExplanationModalAndRetry() {
  document.getElementById('explanationModal').classList.add('hidden');
}

// ==========================================
// 4. 太空扭蛋機操作邏輯 (完全修復狀態重置)
// ==========================================
function resetGachaMachineState() {
  isGachaSpinning = false;
  isBallOpened = false;
  currentDrawnPrize = null;

  const machineSvg = document.getElementById('gachaMachineSvg');
  if (machineSvg) {
    machineSvg.classList.remove('gacha-shaking');
  }

  const droppedBall = document.getElementById('droppedBall');
  if (droppedBall) {
    droppedBall.classList.add('hidden');
    droppedBall.classList.remove('pop-ball-anim');
  }

  const rewardBox = document.getElementById('gachaRewardBox');
  if (rewardBox) {
    rewardBox.classList.add('hidden');
  }

  const spinBtn = document.getElementById('spinBtn');
  if (spinBtn) {
    spinBtn.disabled = false;
    spinBtn.classList.remove('hidden');
  }

  const nextBtn = document.getElementById('nextAfterGachaBtn');
  if (nextBtn) {
    nextBtn.classList.add('hidden');
  }
}

function openGachaStage(canGetBonus) {
  document.getElementById('explanationModal').classList.add('hidden');
  
  // 每次打開扭蛋機前先徹底重置所有按鈕與動畫狀態
  resetGachaMachineState();

  const gachaModal = document.getElementById('gachaModal');
  gachaModal.classList.remove('hidden');
}

// 轉動扭蛋手把
function spinGachaHandle() {
  if (isGachaSpinning || isBallOpened) return;
  isGachaSpinning = true;

  playGachaCrankSfx();

  const machineSvg = document.getElementById('gachaMachineSvg');
  const spinBtn = document.getElementById('spinBtn');
  
  if (spinBtn) spinBtn.disabled = true;
  if (machineSvg) machineSvg.classList.add('gacha-shaking');

  // 隨機抽取獎勵
  currentDrawnPrize = gachaPrizes[Math.floor(Math.random() * gachaPrizes.length)];

  setTimeout(() => {
    if (machineSvg) machineSvg.classList.remove('gacha-shaking');
    if (spinBtn) spinBtn.classList.add('hidden');

    // 扭蛋球滾出
    const droppedBall = document.getElementById('droppedBall');
    const ballColor = document.getElementById('ballColor');
    if (ballColor && currentDrawnPrize) {
      ballColor.className = `w-20 h-20 rounded-full border-4 border-white shadow-2xl flex items-center justify-center text-3xl font-black bg-gradient-to-tr ${currentDrawnPrize.bg}`;
    }
    
    if (droppedBall) {
      droppedBall.classList.remove('hidden');
      droppedBall.classList.add('pop-ball-anim');
    }
    isGachaSpinning = false;
  }, 900);
}

// 打開掉出來的扭蛋
function openGachaBall() {
  if (!currentDrawnPrize || isBallOpened) return;
  isBallOpened = true;

  playGachaOpenSfx();
  
  const droppedBall = document.getElementById('droppedBall');
  if (droppedBall) droppedBall.classList.add('hidden');

  const rewardBox = document.getElementById('gachaRewardBox');
  if (rewardBox) {
    document.getElementById('rewardIcon').innerText = currentDrawnPrize.icon;
    document.getElementById('rewardTitle').innerText = currentDrawnPrize.title;
    document.getElementById('rewardDesc').innerText = currentDrawnPrize.desc;
    rewardBox.classList.remove('hidden');
  }

  // 將扭蛋分數計入全班總分
  totalClassScore += currentDrawnPrize.addScore;
  updateScoreDisplay();

  // 顯示下一關按鈕
  const nextBtn = document.getElementById('nextAfterGachaBtn');
  if (nextBtn) nextBtn.classList.remove('hidden');
}

// 完成扭蛋並繼續下一題
function finishGachaAndContinue() {
  document.getElementById('gachaModal').classList.add('hidden');
  
  // 徹底重置扭蛋機狀態以供下一題使用
  resetGachaMachineState();

  currentQIndex++;
  if (currentQIndex < currentQuestions.length) {
    loadQuestion(currentQIndex);
  } else {
    showVictoryScreen();
  }
}

function updateScoreDisplay() {
  document.getElementById('classScore').innerText = totalClassScore;
}

function showVictoryScreen() {
  playCorrectSfx();
  document.getElementById('finalScore').innerText = `${totalClassScore} 🌟`;
  document.getElementById('victoryModal').classList.remove('hidden');
}

function restartGame() {
  document.getElementById('victoryModal').classList.add('hidden');
  resetGachaMachineState();
  totalClassScore = 0;
  currentQIndex = 0;
  updateScoreDisplay();
  // 重新洗牌
  currentQuestions.sort(() => Math.random() - 0.5);
  loadQuestion(0);
}

// 初始化
window.onload = () => {
  // 初始題目隨機洗牌
  currentQuestions.sort(() => Math.random() - 0.5);
  loadQuestion(0);
  startBgm();
};
</script>
